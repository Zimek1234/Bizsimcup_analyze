name: Web and preserved Python
on:
  push:
    branches: [main, feat/web-supabase]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt -r requirements-service.txt
      - run: python -m pytest -q
      - run: python scripts/export_parity.py
        env:
          PYTHONPATH: .
      - run: npm ci
        working-directory: web
      - run: python scripts/local_stack.py
      - run: python scripts/test_integration.py
      - run: python scripts/seed_local.py
      - run: |
          npm test
          npm run typecheck
          npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Authenticated browser smoke
        run: |
          npm start > ../.local/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login >/dev/null && break || sleep 1; done
          node scripts/smoke.mjs
        working-directory: web
      - name: Stop only test services
        if: always()
        run: docker compose --env-file .local/stack.env -f deployment/local/compose.yml down -v
